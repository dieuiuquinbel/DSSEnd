<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="100%" height="100%">
  <defs>
    <linearGradient id="screen_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="body_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background subtle card -->
  <rect width="400" height="270" rx="16" fill="#f8fafc" />

  <!-- Badge Top -->
  <rect x="24" y="16" width="140" height="22" rx="4" fill="#c084fc" opacity="0.15" />
  <text x="94" y="31" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">CONCEPT MINH HỌA</text>

  <!-- Laptop Display (Open Bezel) -->
  <g filter="url(#shadow)">
    <!-- Display Lid Outer -->
    <rect x="70" y="45" width="260" height="155" rx="8" fill="#0f172a" />
    <!-- Display Screen -->
    <rect x="78" y="53" width="244" height="139" rx="4" fill="url(#screen_grad)" />

    <!-- Screen Content Graphic -->
    <circle cx="200" cy="115" r="32" fill="#c084fc" opacity="0.2" />
    <polygon points="190,105 215,115 190,125" fill="#c084fc" />
    <text x="200" y="152" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MacBook Air 13</text>
    <text x="200" y="168" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle">Apple M5 · Liquid Retina · 1.24kg</text>

    <!-- Webcam dot -->
    <circle cx="200" cy="49" r="2" fill="#64748b" />

    <!-- Laptop Base / Keyboard Deck -->
    <path d="M 40 205 L 360 205 L 340 226 L 60 226 Z" fill="url(#body_grad)" />
    <!-- Hinge -->
    <rect x="150" y="202" width="100" height="5" rx="2.5" fill="#334155" />
    <!-- Trackpad cutout -->
    <rect x="175" y="210" width="50" height="12" rx="2" fill="#0f172a" opacity="0.25" />
    <!-- Rubber feet shadow base -->
    <ellipse cx="200" cy="230" rx="140" ry="4" fill="#000000" opacity="0.1" />
  </g>
</svg>